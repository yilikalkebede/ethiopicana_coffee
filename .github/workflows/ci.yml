name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  DATABASE_URL: postgresql://latitude:latitude@localhost:5432/latitude_ci
  DIRECT_URL: postgresql://latitude:latitude@localhost:5432/latitude_ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NODE_ENV: development

jobs:
  # Fast feedback: lint, typecheck, unit tests, and a real build. Needs a
  # reachable Postgres because `npm run build` statically prerenders
  # /sitemap.xml, which queries the database at build time (verified
  # locally — the build genuinely fails without a live DB, not just a
  # theoretical concern).
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: latitude
          POSTGRES_PASSWORD: latitude
          POSTGRES_DB: latitude_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latitude"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run test
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

  # Slower lane: real browser E2E + accessibility scan against a real
  # production build and a real seeded database. Kept separate from the
  # `test` job so a flaky/slow E2E run never blocks the fast feedback loop.
  e2e:
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: latitude
          POSTGRES_PASSWORD: latitude
          POSTGRES_DB: latitude_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U latitude"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run db:seed
      - run: npx playwright install chromium --with-deps
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      - run: npm run test:e2e
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
